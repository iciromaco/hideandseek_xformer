# base: PPOの基本ハイパーパラメータ（全ターゲット共通）
[base]
# 総ステップ数
total_timesteps = 300000
# 1回のロールアウト長
rollout_steps = 128
# 1更新あたりの学習エポック数
update_epochs = 4
# ミニバッチサイズ（rollout_steps の約数推奨）
minibatch_size = 64
# 学習率
learning_rate = 3.0e-4
# 割引率
gamma = 0.99
# GAE λ
gae_lambda = 0.95
# PPOクリップ係数
clip_coef = 0.20
# Value loss 係数
vf_coef = 0.5
# Entropy 係数（探索強度）
ent_coef = 0.001
# 勾配クリップ
max_grad_norm = 0.5
# ログ/保存間隔（update単位）
log_interval = 10
save_interval = 50

# defaults.<team>: team別の自動調整デフォルト
[defaults.seeker]
learning_rate = 2.2e-4
clip_coef = 0.18
ent_coef = 6.0e-4
update_epochs = 4

[defaults.hider]
learning_rate = 2.0e-4
clip_coef = 0.20
ent_coef = 2.0e-3
update_epochs = 6

# presets.<team>.<env_signature>: 環境構成シグネチャごとの固定プリセット
# env_signature 形式: s{seekers}_h{hiders}_b{boxes}_r{ramps}
[presets.seeker.s1_h2_b2_r1]
total_timesteps = 600000
rollout_steps = 192
update_epochs = 5
minibatch_size = 96
learning_rate = 2.0e-4
clip_coef = 0.17
ent_coef = 6.0e-4
log_interval = 5
save_interval = 25

[presets.seeker.s2_h3_b2_r3]
total_timesteps = 900000
rollout_steps = 256
update_epochs = 4
minibatch_size = 128
learning_rate = 1.7e-4
clip_coef = 0.18
ent_coef = 7.0e-4
log_interval = 5
save_interval = 25

[presets.hider.s1_h2_b2_r1]
total_timesteps = 700000
rollout_steps = 192
update_epochs = 6
minibatch_size = 96
learning_rate = 1.8e-4
clip_coef = 0.20
ent_coef = 2.2e-3
log_interval = 5
save_interval = 25

[presets.hider.s2_h3_b2_r3]
total_timesteps = 1000000
rollout_steps = 256
update_epochs = 6
minibatch_size = 128
learning_rate = 1.6e-4
clip_coef = 0.20
ent_coef = 2.4e-3
log_interval = 5
save_interval = 25

# complexity: 対象シグネチャが無い場合の複雑度ベース補正
[complexity]
# seekers+hiders+boxes+ramps が threshold 以上で補正適用
threshold = 8
rollout_steps_min = 192
minibatch_size_min = 96
learning_rate_max = 2.0e-4
ent_coef_min = 1.0e-3
total_timesteps_min = 700000
# team別補正
hider_clip_coef_min = 0.20
hider_ent_coef_min = 2.0e-3
seeker_clip_coef_max = 0.19
