# hparams_main27.toml
# 実行時プロファイル選択（train / debug）
[runtime]
active_profile = "train"

# runtime.common: train/debug 共通の実行設定
[runtime.common]
# 環境構成
num_seekers = 1
num_hiders = 2
num_boxes = 2
num_ramps = 1
# 1観測あたりのアクション繰り返し回数
action_repeat = 10
# MODE4（HybridSphere）用の静的SDFグリッド解像度[m]
mode4_sdf_cell_size = 0.05
# デバッグ表示
show_turn_lines = false
# policy_source ログ制御（大量ログ抑制）
policy_source_log = false
policy_source_log_each_reset = false
debug_log_interval_steps = 200
# 報酬・評価系
use_custom_reward = true
# 前進飽和抑制（常時前進ボーナスは使わない）
rw_move_sat_penalty = 0.02
 # 壁張り付き対策（全エージェント共通）
rw_wall_stick_penalty = 0.5

rw_wall_near_threshold = 0.18  # 壁近判定閾値（全エージェント共通）
rw_still_speed_threshold = 0.05  # 静止判定速度閾値（全エージェント共通）
rw_hide_visible_near_penalty = 0.025
rw_hide_seeker_gaze_penalty = 0.03
rw_seek_gaze_reward = 0.03
rw_wall_avoid_penalty = 0.15
ramp_check_enabled = false
ramp_check_viewer = false
ramp_check_force_uphill = false
ramp_check_episodes = 3
ramp_check_steps = 220
# 実行基盤
wandb_enabled = true
num_envs = 10

# 速度・移動関連閾値
move_sat_threshold = 1.0
turn_sat_threshold = 1.0
idle_speed_threshold = 0.1
move_incentive_speed_threshold = 0.3

[runtime.optuna]
train_mode = true
use_viewer = false
training_target = "hider"
train_other_hider_policy = "model_if_available"
train_other_seeker_policy = "model_if_available"
npc_only_debug = false
auto_tune_hparams = false
total_timesteps = 30000
wandb_run_name = "wall_only_confirm_1M"
rw_move_sat_penalty = 0.0

# runtime.debug: 再生/検証向け設定
[runtime.debug]
train_mode = false
debug_hider_policy = "model_if_available"
debug_seeker_policy = "model_if_available"
debug_deterministic_inference = false
debug_symmetric_hider_policy = false
npc_only_debug = false
play_episodes = 100
auto_tune_hparams = false

# runtime.train: 学習向け設定
[runtime.train]
train_mode = true
use_viewer = false
training_target = "hider"
train_other_hider_policy = "model_if_available"
train_other_seeker_policy = "model_if_available"
npc_only_debug = false
auto_tune_hparams = false
total_timesteps = 100_000_000
wandb_run_name = "wall_only_confirm_100M"
rw_move_sat_penalty = 0.0

# runtime.train1: Viewer 表示ありの学習環境
[runtime.train1]
train_mode = true
use_viewer = true
training_target = "hider"
train_other_hider_policy = "model_if_available"
train_other_seeker_policy = "model_if_available"
npc_only_debug = false
auto_tune_hparams = false
total_timesteps = 100_000_000
wandb_run_name = "train1"
rw_move_sat_penalty = 0.0
num_envs = 1

# runtime.trainseeker: 学習向け設定 Seeker
[runtime.trainseeker]
train_mode = true
use_viewer = false
training_target = "seeker"
train_other_hider_policy = "model_if_available"
train_other_seeker_policy = "model_if_available"
npc_only_debug = false
auto_tune_hparams = false
total_timesteps = 10_000_000
wandb_run_name = "wall_only_confirm_10M"
rw_move_sat_penalty = 0.0

# runtime.trainseeker_forRB: 学習向け設定 Seeker
[runtime.trainseeker_forRB]
train_mode = true
use_viewer = true
training_target = "seeker"
train_other_hider_policy = "rule"
train_other_seeker_policy = "rule"
use_custom_reward = false
npc_only_debug = false
auto_tune_hparams = false
total_timesteps = 10_000_000
wandb_run_name = "wall_only_confirm_10M"
rw_move_sat_penalty = 0.0
# 壁張り付き対策（全エージェント共通）
rw_wall_stick_penalty = 0.5
rw_wall_near_threshold = 0.18  # 壁近判定閾値（全エージェント共通）
rw_still_speed_threshold = 0.05  # 静止判定速度閾値（全エージェント共通）

# base: PPOの基本ハイパーパラメータ（全ターゲット共通）
[base]
# 隠れ層
hidden_dim = 256
# シーケンス長
seq_len = 16
# 総ステップ数
total_timesteps = 500000
# 1回のロールアウト長
rollout_steps = 128
# 1更新あたりの学習エポック数
update_epochs = 4
# ミニバッチサイズ（rollout_steps の約数推奨）
minibatch_size = 64
# 学習率
learning_rate = 3.0e-4
# 割引率
gamma = 0.995
# GAE λ
gae_lambda = 0.95
# PPOクリップ係数
clip_coef = 0.20
# Value loss 係数
vf_coef = 0.5
# Entropy 係数（探索強度）
ent_coef = 0.001
# --- スケジューリング設定 ---
ent_coef_schedule = "linear"
ent_coef_final = 0.0001
learning_rate_schedule = "linear"
learning_rate_final = 0.00005
# 勾配クリップ
max_grad_norm = 0.5
# ログ/保存間隔（update単位）
log_interval = 10
save_interval = 50

# defaults.<team>: team別の自動調整デフォルト
[defaults.seeker]
learning_rate = 2.2e-4
clip_coef = 0.18
ent_coef = 6.0e-4
update_epochs = 4

[defaults.hider]
learning_rate = 2.0e-4
clip_coef = 0.20
ent_coef = 2.0e-3
update_epochs = 6

# presets.<team>.<env_signature>: 環境構成シグネチャごとの固定プリセット
# env_signature 形式: s{seekers}_h{hiders}_b{boxes}_r{ramps}
[presets.seeker.s1_h2_b2_r1]
total_timesteps = 600000
rollout_steps = 192
update_epochs = 5
minibatch_size = 96
learning_rate = 2.0e-4
clip_coef = 0.17
ent_coef = 6.0e-4
log_interval = 5
save_interval = 25

[presets.seeker.s2_h3_b2_r3]
total_timesteps = 900000
rollout_steps = 256
update_epochs = 4
minibatch_size = 128
learning_rate = 1.7e-4
clip_coef = 0.18
ent_coef = 7.0e-4
log_interval = 5
save_interval = 25

[presets.hider.s1_h2_b2_r1]
total_timesteps = 700000
rollout_steps = 192
update_epochs = 6
minibatch_size = 96
learning_rate = 1.8e-4
clip_coef = 0.20
ent_coef = 2.2e-3
log_interval = 5
save_interval = 25

[presets.hider.s2_h3_b2_r3]
total_timesteps = 1000000
rollout_steps = 256
update_epochs = 6
minibatch_size = 128
learning_rate = 1.6e-4
clip_coef = 0.20
ent_coef = 2.4e-3
log_interval = 5
save_interval = 25

# complexity: 対象シグネチャが無い場合の複雑度ベース補正
[complexity]
# seekers+hiders+boxes+ramps が threshold 以上で補正適用
threshold = 8
rollout_steps_min = 192
minibatch_size_min = 96
learning_rate_max = 2.0e-4
ent_coef_min = 1.0e-3
total_timesteps_min = 700000
# team別補正
hider_clip_coef_min = 0.20
hider_ent_coef_min = 2.0e-3
seeker_clip_coef_max = 0.19
rw_wall_avoid_penalty = 0.24852274025182242